format:
  revealjs:
    toc: true
    toc-depth: 1
    toc-title: "目次"
    fontsize: 24px
    # Use MathJax 4 for MathML and TeX fallbacks, bypassing Reveal.js's MathJax 2 plugin.
    html-math-method: mathml
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
          .reveal pre.verbatim,
          .reveal .verbatim pre {
            font-size: 18px;
          }
          .reveal .gray {
            color: gray;
          }
          .reveal .red {
            color: red;
          }
          :root {
            --r-main-font: "Noto Sans JP", sans-serif;
            --r-heading-font: "Noto Sans JP", sans-serif;
          }
        </style>
        <script>
          window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            output: { font: 'mathjax-stix2' },
            startup: {
              pageReady() {
                return MathJax.startup.defaultPageReady().then(() => {
                  if (window.Reveal) window.Reveal.layout();
                });
              }
            }
          };
        </script>
        <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>

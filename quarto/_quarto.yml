format:
  revealjs:
    slide-number: true
    hash: true
    transition: none
    toc: true
    toc-depth: 1
    toc-title: "目次"
    fontsize: 26px
    # Preserve TeX for MathJax 4; do not invoke Pandoc's MathML conversion or
    # Reveal.js's legacy MathJax 2 plugin. The filter handles every Math node.
    html-math-method: plain
    filters:
      - ../tools/mathjax-tex.lua
    include-in-header:
      text: |
        <script>
          window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            output: {
              fontPath: 'https://cdn.jsdelivr.net/npm/@mathjax/%%FONT%%-font@4.1.3',
              linebreaks: { inline: false }
            }
          };
        </script>
        <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
        <style>
          .reveal .slides img {
            margin-block: 0;
          }
          /* Allow lists to split in the browser's manual print view, too. */
          html.reveal-print .reveal .slides ul,
          html.reveal-print .reveal .slides ol {
            display: block;
          }
          .reveal .slides div.quarto-figure,
          .reveal .slides p:has(> img) {
            margin-block: 0px;
          }
          .reveal .slides .quarto-figure > figure,
          .reveal .slides figure > p:has(> img) {
            margin-block: 0;
          }
          .reveal pre.verbatim,
          .reveal .verbatim pre {
            font-size: 26px;
          }
          .reveal .slides section.compact,
          .reveal .slides section.compact p {
            line-height: 1.15;
          }
          .reveal .slides section.compact p {
            margin-block: 6px;
          }
          .reveal .gray {
            color: gray;
          }
          .reveal .red {
            color: red;
          }
          :root {
            --r-main-font: "BIZ UDPGothic", sans-serif;
            --r-heading-font: "BIZ UDPGothic", sans-serif;
            --r-heading-font-weight: 400;
          }
          .reveal #title-slide .subtitle {
            font-size: 36px;
          }
          .reveal #TOC li {
             margin-block: var(--r-block-margin);
          }
        </style>
